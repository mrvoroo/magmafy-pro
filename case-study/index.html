:root{
  --bg:#0e0716; --bg2:#1a0f27; --surface:#1a0f27;
  --border:rgba(255,210,236,.14); --border-strong:rgba(255,196,226,.32);
  --text:#fff4fa; --muted:#c7b6d6; --faint:#9a89ad;
  --y:#feda75; --o:#fa7e1e; --p:#d62976; --v:#962fbf; --b:#4f5bd5;
  --err:#ff9db8; --ok:#8fe3b0;
  --grad:linear-gradient(100deg,#feda75 0%,#fa7e1e 26%,#d62976 58%,#962fbf 100%);
  --grad-btn:linear-gradient(100deg,#feda75 0%,#fa7e1e 45%,#d62976 100%);
  --f-display:'Space Grotesk','El Messiri','Tajawal',system-ui,sans-serif;
  --f-head:'El Messiri','Space Grotesk','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal','Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.65;
  background-image:radial-gradient(640px 420px at 100% -4%,rgba(150,47,191,.42),transparent 70%),radial-gradient(560px 380px at 0% 30%,rgba(214,41,118,.22),transparent 70%),radial-gradient(520px 340px at 60% 100%,rgba(250,126,30,.18),transparent 70%);
  background-repeat:no-repeat;background-attachment:fixed}
html[lang="en"] body{font-family:'Inter','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] .step-n{font-family:var(--f-display)}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 72px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{width:46px;height:46px;border-radius:13px;display:block}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.4px;direction:ltr;line-height:1.1}
.brand-sub{font-size:13px;color:var(--muted);line-height:1.3}
.lang{min-height:44px;min-width:64px;padding:8px 18px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(30,17,44,.6);color:var(--text);font:700 15px var(--f-display);cursor:pointer}
.lang:hover{border-color:var(--o)}

/* hero */
.hero{margin-top:34px}
.eyebrow{color:var(--y);font-weight:700;font-size:16px}
h1{margin:8px 0 12px;font-family:var(--f-head);font-weight:700;font-size:clamp(32px,7vw,50px);line-height:1.18;text-wrap:balance}
.bar{width:110px;height:6px;border-radius:999px;background:var(--grad);margin:0 0 18px}
.intro{margin:0;color:var(--muted);font-size:18px;max-width:60ch;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:24px}
.fact{padding:16px 18px;border-radius:18px;border:1px solid var(--border);background:rgba(30,17,44,.58)}
.fact.hot{background:var(--bg2);border-color:var(--border-strong)}
.fact small{display:block;color:var(--muted);font-size:14px}
.fact b{display:block;font-family:var(--f-display);font-size:32px;line-height:1.2;margin-top:2px}
.fact.hot b{color:var(--y)}
.fact span{font-size:14px;color:var(--muted)}
.deadline{margin-top:14px;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;border:1px solid var(--border-strong);font-size:15px;font-weight:700}
.deadline i{width:10px;height:10px;border-radius:99px;background:var(--o);display:block}

/* cards */
.card{margin-top:18px;padding:24px 22px;border-radius:24px;border:1px solid var(--border);background:rgba(26,15,39,.86)}
.card-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.step-n{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#feda75,#fa7e1e);color:#1a0f27;font-family:var(--f-head);font-weight:700;font-size:23px}
.card-head h2{margin:0;font-family:var(--f-head);font-weight:700;font-size:25px;line-height:1.3}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.55}

.field{margin-top:16px}
.card-head + .field{margin-top:0}
label,.lbl{display:block;font-weight:700;font-size:16px;margin-bottom:6px}
.hint{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:1px}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-size:17px;line-height:1.5;font-family:inherit}
textarea{min-height:88px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:42px}
html[dir="rtl"] select{background-position:22px 52%,16px 52%}
select option{background:#1a0f27;color:#fff4fa}
::placeholder{color:var(--faint);opacity:1}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(250,126,30,.35)}
[aria-invalid="true"]{border-color:var(--err)!important}
.ltr{direction:ltr;text-align:start}
.err{display:none;margin-top:6px;color:var(--err);font-size:14.5px;font-weight:700}
.err.show{display:block}

/* budget rows */
.rows{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:1fr 112px;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:16px;background:rgba(14,7,22,.55)}
.pname{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin:0}
.dot{width:12px;height:12px;border-radius:99px;flex:none}
.pamt{grid-column:1/-1;color:var(--muted);font-size:14px;min-height:0}
.pamt:empty{display:none}
.pct{position:relative;direction:ltr}
.pct input{padding-inline-end:34px;padding-inline-start:12px;text-align:center}
.pct::after{content:'%';position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.meter{margin-top:14px}
.track{height:10px;border-radius:99px;background:rgba(255,210,236,.14);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .2s}
.fill.over{background:#ff6f9c}
.msum{margin-top:8px;font-weight:700;font-size:15.5px}
.msum.ok{color:var(--ok)}
.msum.bad{color:var(--err)}

/* ideas */
.idea{padding:16px;border:1px solid var(--border);border-radius:18px;background:rgba(14,7,22,.55)}
.idea + .idea{margin-top:12px}
.idea h3 + .field{margin-top:0}
.idea h3{margin:0 0 10px;font-family:var(--f-head);font-size:20px;color:var(--y)}
html[lang="en"] .idea h3{font-family:var(--f-display)}

/* results */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.rbox{padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--border)}
.rbox small{display:block;color:var(--muted);font-size:13.5px}
.rbox b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.25;direction:ltr;text-align:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}.card{padding:20px 16px}.brand-sub{display:none}}

/* submit */
.submit{margin-top:24px}
.btn{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--grad-btn);color:#1a0f27;font:800 20px var(--f-body);cursor:pointer;box-shadow:0 14px 44px -14px rgba(214,41,118,.9)}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.65;cursor:wait}
.status{margin-top:12px;min-height:24px;font-weight:700;font-size:15.5px}
.status.bad{color:var(--err)}
.note{margin-top:6px;color:var(--faint);font-size:13.5px;text-align:center}
.thanks{display:none;margin-top:28px;padding:34px 24px;border-radius:26px;border:1px solid var(--border-strong);background:rgba(26,15,39,.9);text-align:center}
.thanks h2{margin:14px 0 8px;font-family:var(--f-head);font-size:32px}
html[lang="en"] .thanks h2{font-family:var(--f-display)}
.thanks p{margin:0;color:var(--muted);font-size:18px}
.thanks .tick{width:64px;height:64px;border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--grad-btn);color:#1a0f27;font-size:34px;font-weight:800}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:34px;text-align:center;color:var(--faint);font-size:13.5px}
noscript{display:block;margin-top:20px;padding:14px;border:1px solid var(--err);border-radius:14px;color:var(--err)}
</style>
</head>
