<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0716">
<title>Magmafy — إجابات المتقدم</title>
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:'Tajawal';font-style:normal;font-display:swap;font-weight:400;src:url('/assets/fonts/tajawal-arabic-400-normal.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Tajawal';font-style:normal;font-display:swap;font-weight:400;src:url('/assets/fonts/tajawal-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Tajawal';font-style:normal;font-display:swap;font-weight:700;src:url('/assets/fonts/tajawal-arabic-700-normal.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Tajawal';font-style:normal;font-display:swap;font-weight:700;src:url('/assets/fonts/tajawal-latin-700-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'El Messiri';font-style:normal;font-display:swap;font-weight:700;src:url('/assets/fonts/el-messiri-arabic-700-normal.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Space Grotesk';font-style:normal;font-display:swap;font-weight:300 700;src:url('/assets/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2')}
:root{--bg:#0e0716;--bg2:#1a0f27;--border:rgba(255,210,236,.14);--border-strong:rgba(255,196,226,.32);--text:#fff4fa;--muted:#c7b6d6;--faint:#9a89ad;--y:#feda75;--o:#fa7e1e;--p:#d62976;--err:#ff9db8;
 --grad:linear-gradient(100deg,#feda75 0%,#fa7e1e 26%,#d62976 58%,#962fbf 100%);--grad-btn:linear-gradient(100deg,#feda75 0%,#fa7e1e 45%,#d62976 100%);
 --f-display:'Space Grotesk','El Messiri','Tajawal',system-ui,sans-serif;--f-head:'El Messiri','Tajawal',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:17px;line-height:1.7;
 background-image:radial-gradient(620px 400px at 100% -4%,rgba(150,47,191,.4),transparent 70%),radial-gradient(520px 360px at 0% 40%,rgba(214,41,118,.2),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 70px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:12px}
.top b{font-family:var(--f-display);font-size:22px;letter-spacing:.4px;direction:ltr}
.top span{color:var(--muted);font-size:14px;margin-inline-start:auto}
h1{margin:26px 0 6px;font-family:var(--f-head);font-size:clamp(28px,6vw,40px);line-height:1.2}
.bar{width:100px;height:6px;border-radius:99px;background:var(--grad);margin-bottom:18px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(30,17,44,.6);font-size:15px;font-weight:700;color:var(--text);text-decoration:none}
.chip small{color:var(--muted);font-weight:400;margin-inline-end:6px}
a.chip:hover{border-color:var(--o)}
.card{margin-top:16px;padding:22px 20px;border-radius:22px;border:1px solid var(--border);background:rgba(26,15,39,.88)}
.card h2{margin:0 0 14px;display:flex;align-items:center;gap:12px;font-family:var(--f-head);font-size:23px}
.n{flex:none;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#feda75,#fa7e1e);color:#1a0f27;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:20px}
.lbl{color:var(--muted);font-size:14.5px;font-weight:700;margin:14px 0 2px}
.lbl:first-of-type{margin-top:0}
.txt{margin:0;white-space:pre-wrap;word-break:break-word}
.prow{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:12px;margin:8px 0}
.prow .t{height:12px;border-radius:99px;background:rgba(255,210,236,.14);overflow:hidden}
.prow .f{height:100%;border-radius:99px}
.prow b{direction:ltr;text-align:end;font-family:var(--f-display)}
.dot{display:inline-block;width:11px;height:11px;border-radius:99px;margin-inline-end:8px}
.idea{padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:rgba(14,7,22,.55);margin-top:10px}
.idea h3{margin:0 0 6px;font-family:var(--f-head);font-size:19px;color:var(--y)}
.tag{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;border:1px solid var(--border-strong);font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.box{padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--border)}
.box small{display:block;color:var(--muted);font-size:13.5px}
.box b{display:block;font-family:var(--f-display);font-size:25px;direction:ltr;text-align:start}
.gate{margin-top:40px;padding:26px 20px;border-radius:22px;border:1px solid var(--border-strong);background:rgba(26,15,39,.9)}
.gate label{display:block;font-weight:700;margin-bottom:8px}
.gate input{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font:inherit;direction:ltr;text-align:start}
.gate input:focus-visible,.btn:focus-visible{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(250,126,30,.35)}
.btn{margin-top:14px;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--grad-btn);color:#1a0f27;font:800 19px 'Tajawal',sans-serif;cursor:pointer}
.msg{margin-top:12px;font-weight:700;min-height:24px}
.msg.bad{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="/assets/img/logo-mark.webp" width="44" height="44" alt="Magmafy">
    <b>Magmafy</b>
    <span>إجابات مهمة التقييم · للاستخدام الداخلي</span>
  </div>

  <form class="gate" id="gate" autocomplete="off">
    <label for="key">مفتاح الدخول</label>
    <input type="password" id="key" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">عرض الإجابات</button>
    <div class="msg" id="gateMsg" role="status" aria-live="polite"></div>
  </form>

  <main id="out" hidden></main>
</div>

<script>
(function () {
  'use strict';
  var CONFIG = { endpoint: 'https://script.google.com/macros/s/AKfycbz9bigUDDTmyyRjlSwTRwtjE7BYAamQ3gRQFs9oDoe_Lqr88SE504cVwaOk6ZyESzLmKA/exec', keyStore: 'mg-cs-admin-key', budget: 15000 };
  var PLAT = [
    { id: 'snapchat', name: 'سناب', color: '#feda75' },
    { id: 'meta', name: 'ميتا', color: '#4f5bd5' },
    { id: 'tiktok', name: 'تيك توك', color: '#d62976' },
    { id: 'google', name: 'جوجل', color: '#fa7e1e' }
  ];
  var GOALS = { awareness: 'وعي بالمتجر', chats: 'رسائل واتساب', sales: 'مبيعات مباشرة', retarget: 'إعادة استهداف' };

  var $ = function (s) { return document.querySelector(s); };
  var id = '';
  try { id = (new URLSearchParams(location.search).get('id') || '').slice(0, 80); } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(n) { return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function lbl(parent, text) { parent.appendChild(el('div', 'lbl', text)); }
  function para(parent, text) { parent.appendChild(el('p', 'txt', text || '—')); }
  function card(num, title) {
    var c = el('section', 'card');
    var h = el('h2'); h.appendChild(el('span', 'n', num)); h.appendChild(document.createTextNode(title));
    c.appendChild(h); return c;
  }

  function render(r) {
    var out = $('#out'); out.textContent = '';
    out.appendChild(el('h1', null, r.name || '—'));
    out.appendChild(el('div', 'bar'));

    var meta = el('div', 'meta');
    var digits = String(r.phone || '').replace(/\D/g, '');
    var wa = el('a', 'chip'); wa.href = 'https://wa.me/' + digits; wa.target = '_blank'; wa.rel = 'noopener noreferrer';
    wa.appendChild(el('small', null, 'واتساب')); wa.appendChild(document.createTextNode(r.phone || ''));
    meta.appendChild(wa);
    var when = el('span', 'chip'); when.appendChild(el('small', null, 'وقت الإرسال'));
    var dt = new Date(r.submittedAt);
    when.appendChild(document.createTextNode(isNaN(dt) ? '' : dt.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })));
    meta.appendChild(when);
    if (r.ref) { var rf = el('span', 'chip'); rf.appendChild(el('small', null, 'كود الرابط')); rf.appendChild(document.createTextNode(r.ref)); meta.appendChild(rf); }
    out.appendChild(meta);

    // 1 budget
    var c1 = card('1', 'توزيع الميزانية');
    PLAT.forEach(function (p) {
      var v = Number((r.budget || {})[p.id]) || 0;
      var row = el('div', 'prow');
      var name = el('div'); var d = el('span', 'dot'); d.style.background = p.color; name.appendChild(d); name.appendChild(document.createTextNode(p.name));
      var t = el('div', 't'); var f = el('div', 'f'); f.style.width = Math.min(v, 100) + '%'; f.style.background = p.color; t.appendChild(f);
      row.appendChild(name); row.appendChild(t); row.appendChild(el('b', null, v + '%  ·  ' + fmt(CONFIG.budget * v / 100)));
      c1.appendChild(row);
    });
    lbl(c1, 'سبب التوزيع'); para(c1, r.budgetWhy);
    out.appendChild(c1);

    // 2 campaigns
    var c2 = card('2', 'هيكل الحملات');
    var any = false;
    PLAT.forEach(function (p) {
      var txt = (r.campaigns || {})[p.id];
      if (!txt) return; any = true;
      lbl(c2, p.name); para(c2, txt);
    });
    if (!any) para(c2, '—');
    out.appendChild(c2);

    // 3 ideas
    var c3 = card('3', 'أفكار الإعلانات');
    (r.ideas || []).forEach(function (it, i) {
      var b = el('div', 'idea'); b.appendChild(el('h3', null, 'الفكرة ' + (i + 1)));
      para(b, it.text);
      if (it.goal) b.appendChild(el('span', 'tag', 'الهدف: ' + (GOALS[it.goal] || it.goal)));
      c3.appendChild(b);
    });
    out.appendChild(c3);

    // 4 numbers
    var c4 = card('4', 'الأرقام المتوقعة');
    var g = el('div', 'grid');
    [['تكلفة المحادثة (ريال)', fmt(r.costPerConversation)], ['نسبة الإغلاق', fmt(r.closeRate) + '%'],
     ['محادثات', fmt((r.calc || {}).conversations)], ['مبيعات', fmt((r.calc || {}).sales)],
     ['إيراد (ريال)', fmt((r.calc || {}).revenue)], ['العائد على الإنفاق', Number((r.calc || {}).roas).toFixed(1) + 'x']
    ].forEach(function (x) { var b = el('div', 'box'); b.appendChild(el('small', null, x[0])); b.appendChild(el('b', null, x[1])); g.appendChild(b); });
    c4.appendChild(g);
    lbl(c4, 'طريقة الحساب'); para(c4, r.calcExplain);
    out.appendChild(c4);

    // 5 plan
    var c5 = card('5', 'خطة الأسبوع الأول');
    lbl(c5, 'هيختبر إيه؟'); para(c5, (r.plan || {}).test);
    lbl(c5, 'متى يوقف إعلان؟'); para(c5, (r.plan || {}).stop);
    lbl(c5, 'متى يزود الميزانية؟'); para(c5, (r.plan || {}).scale);
    out.appendChild(c5);

    out.hidden = false;
    $('#gate').hidden = true;
    document.title = 'Magmafy — ' + (r.name || 'إجابات المتقدم');
  }

  function load(key) {
    var msg = $('#gateMsg'); msg.className = 'msg'; msg.textContent = 'جاري التحميل...';
    if (!id) { msg.className = 'msg bad'; msg.textContent = 'الرابط ناقص. افتح الصفحة من زرار الإجابات.'; return; }
    if (CONFIG.endpoint.indexOf('PASTE_') === 0) { msg.className = 'msg bad'; msg.textContent = 'الصفحة لسه مش متوصلة بالاستلام (endpoint).'; return; }
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'view', id: id, key: key }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok && j.response) {
          try { sessionStorage.setItem(CONFIG.keyStore, key); } catch (e) {}
          render(j.response); return;
        }
        try { sessionStorage.removeItem(CONFIG.keyStore); } catch (e) {}
        msg.className = 'msg bad';
        msg.textContent = (j && j.error === 'not_found') ? 'مفيش إجابات بالرابط ده.' : 'مفتاح الدخول غلط.';
      })
      .catch(function () { msg.className = 'msg bad'; msg.textContent = 'تعذر الاتصال. جرّب تاني.'; });
  }

  $('#gate').addEventListener('submit', function (ev) { ev.preventDefault(); var k = $('#key').value.trim(); if (k) load(k); });
  var saved = ''; try { saved = sessionStorage.getItem(CONFIG.keyStore) || ''; } catch (e) {}
  if (saved && id) load(saved);
})();
</script>
</body>
</html>
